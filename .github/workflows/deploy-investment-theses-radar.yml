name: Deploy Investment Theses Radar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/investment-theses-radar/**"
      - ".github/workflows/deploy-investment-theses-radar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/investment-theses-radar

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
