<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03141c" />
    <meta name="description" content="Thesis Radar monitoriza portfolio, sincroniza datos y genera informes de inversion bajo demanda." />
    <title>Thesis Radar</title>
    <link rel="manifest" href="./manifest.webmanifest?v=15" />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <main class="device" aria-label="Thesis Radar">
      <section class="phone">
        <header class="app-topbar">
          <button class="icon-button" id="backButton" type="button" aria-label="Volver" title="Volver">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19 8 12l7-7" /></svg>
          </button>
          <div>
            <h1 id="screenTitle">Thesis Radar</h1>
            <p id="screenSubtitle">Datos reales</p>
          </div>
          <button class="icon-button" id="topAction" type="button" aria-label="Accion principal" title="Accion principal">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
        </header>

        <section class="screen is-active" id="screen-watchlist" data-title="Thesis Radar" data-subtitle="Portfolio" data-action="none"></section>
        <section class="screen" id="screen-detail" data-title="Detalle" data-subtitle="Activo" data-action="none"></section>
        <section class="screen" id="screen-report" data-title="Informe" data-subtitle="OpenAI bajo demanda" data-action="share"></section>
        <section class="screen" id="screen-thesis" data-title="Tesis" data-subtitle="Drivers y riesgos" data-action="none"></section>
        <section class="screen" id="screen-history" data-title="Historico" data-subtitle="Series reales" data-action="none"></section>
        <section class="screen" id="screen-add" data-title="Anadir ticker" data-subtitle="Ticker real" data-action="none"></section>
        <section class="screen" id="screen-discovery" data-title="Discovery" data-subtitle="IA futura" data-action="none"></section>
        <section class="screen" id="screen-settings" data-title="Ajustes" data-subtitle="Sync e IA" data-action="none"></section>

        <nav class="bottom-nav" aria-label="Navegacion principal">
          <button class="is-active" data-route="watchlist" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10" /></svg><span>Portfolio</span></button>
          <button data-route="discovery" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18" /></svg><span>Discovery</span></button>
          <button data-route="report" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l3 3v15H7z" /><path d="M9 12h6M9 16h6M9 8h3" /></svg><span>Informes</span></button>
          <button data-route="thesis" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v10l8 4 8-4V7z" /><path d="M12 7v14" /></svg><span>Tesis</span></button>
          <button data-route="history" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-4 3 2 5-7" /></svg><span>Historico</span></button>
          <button data-route="settings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /><path d="M19.4 15a8 8 0 0 0 .1-6l2-1.5-2-3.5-2.4 1a8 8 0 0 0-5.2-3l-.4-2h-4l-.4 2a8 8 0 0 0-5.2 3l-2.4-1-2 3.5L4.5 9a8 8 0 0 0 .1 6l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 5.2 3l.4 2h4l.4-2a8 8 0 0 0 5.2-3l2.4 1 2-3.5Z" /></svg><span>Ajustes</span></button>
        </nav>
      </section>
    </main>
    <script src="./app.js?v=15"></script>
  </body>
</html>
